<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1GP Track Renderer</title>
<!--
  The game runs in js-dos direct mode; the page reads its state every
  animation frame and draws the 3D view with WebGL from the game's camera, at
  the canvas's full resolution. By default it shows one screen: the game's
  own screen in the menus, and in the car our view with the game's cockpit,
  dash, mirrors and messages laid over it.

    cd spike && node serve.mjs --port 8080
    http://127.0.0.1:8080/render.html?bundle=dist/p2-render-25000.jsdos

  Query options:
    bundle=...            the js-dos bundle (built with build-bundle.mjs; default
                          dist/f1gp.jsdos, the one build-site.mjs puts on the site)
    framing=wide|original wide keeps the game's vertical scale and shows more
                          at the sides; original matches the game's framing (4:3, where
                          the game's cockpit sides are). Default from the style; also
                          the Shape menu
    smooth=1|0            ease between game frames (one game frame behind)
    layout=single|side|gl|overlay  single (default): one screen, the game's screen
                          in menus and our 3D view when you are in the car, with
                          the game's cockpit, dash and messages laid over it;
                          side: the original screen beside the new view; gl: the
                          new view alone; overlay: the new view (game framing)
                          laid half transparent over the original screen
    screen=new|original   new (default in the single layout): the game's own 3D
                          drawing is replaced by a fill (lib/overlay.mjs; the game
                          still draws its mirror backdrop and start lights, the page
                          the cars in the mirrors) and our view shows instead;
                          original (default in the others): the game draws its 3D
                          as it always did. Also a menu.
    cars=1|0              draw the cars as the game does (boxes with source=file)
    objects=1|0           draw the trackside objects (stands, buildings, trees, boards)
    style=modern|classic  modern: every car as a 3D model at any distance, 3D wheels
                          and helmets, all cars on the circuit, smooth haze;
                          classic: as the game draws (bitmap cars beyond 52 ft,
                          bitmap wheels and helmets, its choice of cars, its haze
                          steps) and the game's 4:3 framing. Also a menu on the page.
    machine=dosbox|rust   the PC the game runs on: js-dos's DOSBox (default), or our own
                          in Rust (spike/machine, dist/machine.wasm: a 286 with the devices
                          and DOS services gp.exe uses; it starts gp /g, without the intro,
                          and has no AdLib sound: the Amiga sound plays)
    r3d=game|ours|gpu     with machine=rust, where the game draws its own 3D view
                          (screen=original): its own code (game, the default), or our
                          Rust port of it (ours, spike/machine/src/r3d/: the same
                          picture, without emulating the 3D code, so the game keeps
                          its frame rate on a slower emulated CPU); gpu: ours, with
                          the 3D view drawn again by the game's rules at a higher
                          resolution and painted by WebGPU, the game's cockpit, dash
                          and messages over it (lib/gpu-r3d.mjs); ours without WebGPU
    scale=auto|1..6       r3d=gpu: the 3D view's resolution, in game pixels (1: the
                          game's own pixels); auto, the default: the screen's pixels
    art=pixels|smooth     r3d=gpu: the bitmaps (wheels, helmets, boards, trees) where they
                          are drawn larger than their art: as its square pixels (the
                          default), or smoothed by a pixel-art filter that keeps the
                          game's colours (machine/src/r3d/fine.rs)
    gpucheck=1            r3d=gpu at scale 1, for probes: every 15th frame read back
                          and compared with the game's screen (renderApp.gpu)
    pad=auto|off          auto: a game controller drives (once the browser sees it: press
                          one of its buttons): in a session its left stick steers and its
                          triggers accelerate and brake through the game's own joystick
                          code (lib/joystick.mjs), its buttons press the game's keys
                          (lib/gamepad.mjs; the Keys panel lists them). A driving key
                          (A, Z, comma, full stop) gives the controls back to the
                          keyboard until the controller is used again. off: ignore it
    manual=auto|off       auto: take the player through the manual check (English manual,
                          the word typed) and the joystick question (Use Keys)
    audio=own|off         the game's sound through our AudioWorklet (starts on the first
                          key or click), or none
    sound=amiga|amiga-clean|adlib  the Amiga version's sound (default): its title tune in the
                          menus, its sampled engine and race effects in a session, played
                          from the game's events (lib/amiga-sound.mjs; needs
                          dist/amiga-sound.bin, else the AdLib plays), through the A500's
                          filters or without them (clean); or the PC version's AdLib sound,
                          the game's own. Also a menu.
    haze=smooth|classic|off  distance haze with the game's haze tables: blended,
                          in the game's steps, or none (default from the style)
    texture=smooth|classic|off  the ground texture (the game's T option): the road and
                          grass in their neighbouring shades, blended or in the game's
                          whole shades, or flat (default from the style)
    crowd=stands|sharp|screen  the crowd in the stands: on the stands, in coarser texels far
                          away (modern), on the stands texel by texel (classic), or fixed
                          to the screen as the game draws it
    poles=solid|pixel     flag poles and posts six inches wide, at least one game pixel
                          (modern), or one game pixel wide as the game draws them (classic)
    cockpit=smooth|pixels the game's cockpit, dash and messages over our view: drawn larger
                          through xBR, a filter made for pixel art (lib/pixel-smooth.mjs;
                          modern), or as square pixels (classic). Also a menu.
    mirrors=real|game     the cockpit mirrors: real rear views from our renderer (modern),
                          bowed a little as a convex mirror, under a glass sheen; or the
                          game's (classic): its fixed backdrop with the cars behind as
                          its bitmaps
    shade=on|off          the faces of the scene's shapes (stands, buildings, cars) lit very
                          slightly by a fixed sun (modern), or as the game colours them
    shadows=on|off        the stands', buildings', bridges' and walls' shadows from the same
                          sun on the road, the ground and each other (modern), or none
    lod=steady|game       the trackside shapes and bitmaps: the near version at every
                          distance, turned by the ray's own angle (modern: trees and boards
                          do not pop or flick), or as the game picks them by depth and
                          screen column (classic; less to draw)
    fps=30|25|15|...|game the game's frame rate, set in the menus for the next session
                          (30, the default, is the most the game's physics allows; game
                          keeps the game's own setting, 15 in the Quick Race)
    cycles=auto|fixed     auto: the emulated CPU runs slower (8,000 cycles, raised when
                          the game's load climbs) while our view replaces the game's
                          drawing or our port draws it (r3d=ours), and at 25,000
                          otherwise; fixed: as the bundle says
    sleep=timer|spin      how the emulator waits out the rest of each millisecond: on a
                          timer (default, lib/dos-sleep.mjs), or as js-dos does, passing
                          messages to itself until the time comes (the main thread busy)
    saves=on|off          on (default): the files the game writes (C:\GPSAVES, F1PREFS.DAT)
                          are kept in this browser and laid over the bundle on the next
                          visit (lib/saves.mjs; the Saves button lists them and forgets
                          them). The menu choices (screen, sound, shape, style, cockpit)
                          are kept too; an option in the address wins.
    source=memory|file    build the scene from the game's memory (all parts,
                          the game's colours, sky and horizon image) or from
                          the track file (road, kerbs and verges only)
-->
<style>
  :root { --bg: #f4f3ef; --fg: #1d1d1b; --muted: #6b6a66; --panel: #ffffff; --line: #d9d7d0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecebe6; --muted: #9a9993; --panel: #20201e; --line: #3a3936; }
  }
  :root[data-theme="dark"] { --bg: #161615; --fg: #ecebe6; --muted: #9a9993; --panel: #20201e; --line: #3a3936; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  #status { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  #notice { color: var(--muted); font-size: 13px; }
  header label { color: var(--muted); font-size: 13px; }
  header select, header button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
  header button { font-size: 13px; cursor: pointer; }
  #keys { margin: 0 16px 12px; padding: 4px 16px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; columns: 2 300px; column-gap: 32px; font-size: 13px; }
  #keys h3 { font-size: 13px; margin: 10px 0 4px; break-after: avoid; }
  #keys p { margin: 0 0 4px; color: var(--muted); }
  #keys table { border-collapse: collapse; break-inside: avoid; width: 100%; }
  #keys td { padding: 2px 8px 2px 0; vertical-align: top; }
  #keys td:first-child { white-space: nowrap; width: 7.5em; }
  #saves { margin: 0 16px 12px; padding: 4px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; font-size: 13px; max-width: 70ch; }
  #saves p { margin: 8px 0; }
  #keys kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; }
  main { display: flex; gap: 12px; padding: 0 16px 16px; flex-wrap: wrap; align-items: flex-start; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  #screen, #gpu { width: 480px; aspect-ratio: 4 / 3; image-rendering: pixelated; display: block; outline: none; }
  #screen[hidden], #gpu[hidden] { display: none; }
  #gl { width: min(100%, 960px); aspect-ratio: 16 / 9; display: block; }
  .glpane { flex: 1 1 560px; min-width: 0; }
  .glwrap { position: relative; }
  #glnote { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; color: #c9c8c2; font-size: 15px; pointer-events: none; }
  #glnote[hidden] { display: none; }
  #perf { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin: 6px 0 0; }
  body.gl-only .origpane { display: none; }
  body.overlay .glpane { display: none; }
  body.overlay .origpane { position: relative; }
  body.overlay #screen, body.overlay #gpu { width: min(960px, calc(100vw - 50px)); }
  #overgl { display: none; position: absolute; left: 8px; top: 8px; opacity: 0.5; pointer-events: none; image-rendering: pixelated; }
  body.overlay #overgl { display: block; }
  @media (max-width: 700px) { #screen, #gpu { width: 100%; } main { padding: 0 16px 16px; } }
  /* one screen */
  body.single main { display: block; padding: 0 16px 12px; }
  #stage { position: relative; width: 100%; height: calc(100vh - 72px); min-height: 240px; background: #000; overflow: hidden; border-radius: 6px; }
  #stage canvas { position: absolute; top: 0; height: 100%; display: block; image-rendering: pixelated; }
  #stage #screen, #stage #gpu, #stage #hud, #stage #hudsmooth { left: 50%; transform: translateX(-50%); width: auto; aspect-ratio: 4 / 3; }
  #stage #gl { left: 0; width: 100%; aspect-ratio: auto; image-rendering: auto; }
  body.narrow #stage #gl { left: 50%; transform: translateX(-50%); width: auto; aspect-ratio: 4 / 3; }
  #stage #hud, #stage #hudsmooth { pointer-events: none; }
  #stage #hudsmooth { image-rendering: auto; }
  #stage [hidden] { display: none; }
  body.single #perf { margin: 6px 0 0; }
</style>
</head>
<body>
<header><h1>F1GP track renderer</h1>
  <label>Screen <select id="screenmode"><option value="new">New view</option><option value="original">Original game</option></select></label>
  <label>Sound <select id="sound"><option value="amiga">Amiga</option><option value="amiga-clean">Amiga, no filter</option><option value="adlib">PC: AdLib</option></select></label>
  <label>Shape <select id="shape"><option value="wide">Wide</option><option value="original">4:3, as the game</option></select></label>
  <label>Cockpit <select id="cockpit"><option value="smooth">Smoothed</option><option value="pixels">Pixels, as the game</option></select></label>
  <label>Style <select id="style"><option value="modern">Modern: 3D cars</option><option value="classic">Classic: as the original</option></select></label>
  <button id="keysbtn" type="button" aria-expanded="false" aria-controls="keys">Keys</button>
  <button id="savesbtn" type="button" aria-expanded="false" aria-controls="saves">Saves</button>
  <span id="status">loading...</span><span id="notice"></span></header>
<div id="keys" hidden></div>
<div id="saves" hidden><p id="savesinfo"></p><p><button id="forget" type="button">Forget them and restart</button> <span id="forgetask" hidden>Forget every saved game, name, track record, car setup and option in this browser? <button id="forgetyes" type="button">Yes, forget</button> <button id="forgetno" type="button">Keep them</button></span></p></div>
<main>
  <div class="pane origpane"><canvas id="screen" width="320" height="200" tabindex="0"></canvas><canvas id="gpu" width="320" height="200" hidden></canvas><canvas id="overgl"></canvas></div>
  <div class="pane glpane"><div class="glwrap"><canvas id="gl"></canvas><div id="glnote">The new view starts when you are in the car.</div></div><pre id="perf"></pre></div>
</main>
<script src="node_modules/js-dos/dist/emulators/emulators.js"></script>
<script type="module">
import { attach } from './lib/f1gp-mem.mjs';
import { createReader } from './lib/f1gp-state.mjs';
import { parseTrack, compileTrack, compilePitLane, CIRCUITS } from './lib/track-file.mjs';
import { fromCompiled } from './lib/track-mesh.mjs';
import { TrackRenderer, cameraFromState, lerpCamera } from './lib/gl-track.mjs';
import { readScene, readPalette, horizonOff, textureOn, markingsKey } from './lib/scene.mjs';
import { readObjects, readCrowd, cameraInPitLane } from './lib/objects.mjs';
import { readCars, carStates, selectCars, frameCars, lerpCarStates, mirrorClip, mirrorCars as mirrorCarList, spinWheels } from './lib/cars.mjs';
import { makeOwnAudio } from './lib/audio.mjs';
import { makeAmigaSound } from './lib/amiga-sound.mjs';
import { keysHtml } from './lib/keys.mjs';
import { manualHelper } from './lib/manual.mjs';
import { sceneRoutine, viewportFill, chooseMarker, keyFrame, paintMirrors, shownMarker, dimPixels } from './lib/overlay.mjs';
import { setFrameRate, frameTicks, readFrameTicks, readWorkTicks, cyclesGovernor, framePacer } from './lib/pace.mjs';
import { timerSleep } from './lib/dos-sleep.mjs';
import { makeSmoother } from './lib/pixel-smooth.mjs';
import { readPad, firstPad, padKeys } from './lib/gamepad.mjs';
import { virtualJoystick } from './lib/joystick.mjs';
import { createPC, pcCommandInterface } from './lib/pc.mjs';
import { gpuView } from './lib/gpu-r3d.mjs';
import { changeStore, keeper, menuChoices } from './lib/saves.mjs';
import { unzipSync, zipSync } from './node_modules/fflate/esm/browser.js';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
// the menu choices from the last visit; the address wins
const choices = menuChoices(['screen', 'sound', 'framing', 'style', 'cockpit']);
choices.apply(q);
const opts = {
  bundle: q.get('bundle') ?? 'dist/f1gp.jsdos',
  framing: q.get('framing') ?? 'wide',
  smooth: (q.get('smooth') ?? '1') !== '0',
  layout: q.get('layout') ?? 'single',
  // the single layout swaps to our view; the comparison layouts keep the game's drawing unless asked
  screen: q.get('screen') ?? ((q.get('layout') ?? 'single') === 'single' ? 'new' : 'original'),
  cars: (q.get('cars') ?? '1') !== '0',
  source: q.get('source') ?? 'memory',
  objects: (q.get('objects') ?? '1') !== '0',
  style: q.get('style') === 'classic' ? 'classic' : 'modern',
  hazeParam: q.get('haze'),
  textureParam: q.get('texture'),
  crowdParam: q.get('crowd'),
  polesParam: q.get('poles'),
  mirrorsParam: ['real', 'game'].includes(q.get('mirrors')) ? q.get('mirrors') : null,
  cockpitParam: ['smooth', 'pixels'].includes(q.get('cockpit')) ? q.get('cockpit') : null,
  shadeParam: ['on', 'off'].includes(q.get('shade')) ? q.get('shade') : null,
  shadowsParam: ['on', 'off'].includes(q.get('shadows')) ? q.get('shadows') : null,
  lodParam: ['steady', 'game'].includes(q.get('lod')) ? q.get('lod') : null,
  audio: q.get('audio') ?? 'own',
  // the Amiga version's sound unless asked for the PC's (falls back to it without dist/amiga-sound.bin)
  sound: ['adlib', 'amiga', 'amiga-clean'].includes(q.get('sound')) ? q.get('sound') : 'amiga',
  manual: q.get('manual') ?? 'auto',
  pad: q.get('pad') === 'off' ? 'off' : 'auto',
  // the PC the game runs on: js-dos's DOSBox, or ours in Rust (machine/, dist/machine.wasm)
  machine: q.get('machine') === 'rust' ? 'rust' : 'dosbox',
  // with our PC, the game's 3D drawn by our port of its routine (machine/src/r3d/)
  r3d: ['ours', 'gpu'].includes(q.get('r3d')) ? q.get('r3d') : 'game',
  // r3d=gpu: the 3D view's scale (auto: the screen's pixels), and checks for probes
  scale: /^[1-6]$/.test(q.get('scale') ?? '') ? +q.get('scale') : 'auto',
  art: q.get('art') === 'smooth' ? 'smooth' : 'pixels',
  gpucheck: q.get('gpucheck') === '1',
  framingParam: q.get('framing'),
  // the game's frame rate, set in the menus for the next session (30 at most); 'game' keeps the game's own
  fps: q.get('fps') === 'game' ? null : Math.min(30, Math.max(8, +(q.get('fps') ?? 30) || 30)),
  // auto: a low emulated CPU speed while our view replaces the game's drawing, raised when the game needs it
  cycles: q.get('cycles') ?? 'auto',
  // timer: the emulator's idle time spent idle, not passing messages (lib/dos-sleep.mjs)
  sleep: q.get('sleep') === 'spin' ? 'spin' : 'timer',
  // keep the game's saved files in the browser between visits (lib/saves.mjs)
  saves: (q.get('saves') ?? 'on') !== 'off',
};
// the style sets the defaults; explicit haze= and framing= win
function applyStyle(style) {
  opts.style = style;
  opts.haze = opts.hazeParam ?? (style === 'classic' ? 'classic' : 'smooth');
  opts.texture = opts.textureParam ?? (style === 'classic' ? 'classic' : 'smooth');
  opts.crowd = opts.crowdParam ?? (style === 'classic' ? 'sharp' : 'stands');
  opts.poles = opts.polesParam ?? (style === 'classic' ? 'pixel' : 'solid');
  opts.mirrors = opts.mirrorsParam ?? (style === 'classic' ? 'game' : 'real');
  opts.cockpit = opts.cockpitParam ?? (style === 'classic' ? 'pixels' : 'smooth');
  opts.shade = opts.shadeParam ?? (style === 'classic' ? 'off' : 'on');
  opts.shadows = opts.shadowsParam ?? (style === 'classic' ? 'off' : 'on');
  opts.lod = opts.lodParam ?? (style === 'classic' ? 'game' : 'steady');
  const ck = document.getElementById('cockpit');
  if (ck) ck.value = opts.cockpit;
  if (!opts.framingParam && opts.layout !== 'overlay') opts.framing = style === 'classic' ? 'original' : 'wide';
  document.body.classList.toggle('classic', style === 'classic');
  showShape();
}
// the new view's shape: wide, or the game's 4:3 (with the game's cockpit sides, which are drawn in the 4:3)
function showShape() {
  document.body.classList.toggle('narrow', opts.framing === 'original');
  const sel = document.getElementById('shape');
  if (sel) { sel.value = opts.framing === 'original' ? 'original' : 'wide'; sel.disabled = opts.layout === 'overlay'; }
}
applyStyle(opts.style);
{
  const sel = $('shape');
  sel.addEventListener('change', () => {
    opts.framing = opts.framingParam = sel.value;
    showShape();
    choices.set('framing', sel.value);
    sel.blur();
  });
}
{
  const sel = $('cockpit');
  sel.value = opts.cockpit;
  sel.addEventListener('change', () => {
    opts.cockpit = opts.cockpitParam = sel.value;
    choices.set('cockpit', sel.value);
    sel.blur();
  });
}
{
  const sel = $('style');
  sel.value = opts.style;
  sel.addEventListener('change', () => {
    applyStyle(sel.value);
    choices.set('style', sel.value);
    sel.blur(); // keys go back to the game
  });
}
if (opts.layout === 'gl') document.body.classList.add('gl-only');
if (opts.layout === 'single') {
  // one stage: the game's screen, our view and the game's screen as an overlay, in one box
  document.body.classList.add('single');
  const stage = document.createElement('div');
  stage.id = 'stage';
  const hudCanvas = document.createElement('canvas');
  hudCanvas.id = 'hud'; hudCanvas.width = 320; hudCanvas.height = 200; hudCanvas.hidden = true;
  // the same, smoothed for pixel art (cockpit=smooth, lib/pixel-smooth.mjs)
  const hudSmooth = document.createElement('canvas');
  hudSmooth.id = 'hudsmooth'; hudSmooth.hidden = true;
  const gl = $('gl'), scr = $('screen'), perfEl = $('perf');
  document.querySelector('main').prepend(stage);
  stage.append(gl, hudCanvas, hudSmooth, scr, $('gpu'));
  gl.hidden = true;
  stage.after(perfEl);
  document.querySelector('.origpane').remove();
  document.querySelector('.glpane').remove();
}
{
  const sel = $('screenmode');
  sel.value = opts.screen;
  sel.addEventListener('change', () => {
    opts.screen = sel.value;
    choices.set('screen', sel.value);
    sel.blur();
  });
}
// the game's keys, under the header
{
  const panel = $('keys'), btn = $('keysbtn');
  panel.innerHTML = keysHtml();
  btn.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    btn.setAttribute('aria-expanded', String(!panel.hidden));
    btn.blur(); // keys go back to the game
  });
}
// the game's saved files, kept in this browser (lib/saves.mjs)
const changes = changeStore();
let saves = null;
function showSaves(record) {
  const files = record ? record.files : (saves ? saves.files : []);
  const names = files.map((f) => f.replace(/^GPSAVES\//, ''));
  $('savesinfo').textContent = !opts.saves ? 'Saving is off (saves=off): the game\'s files last until the page closes.'
    : files.length ? `Kept in this browser: ${names.join(', ')}${record?.savedAt ? `, last at ${new Date(record.savedAt).toLocaleTimeString()}` : ''}. They come back on your next visit.`
    : 'Nothing kept yet. Saved games, names, track records, car setups (Load/Save Game in the main menu) and the game\'s options are kept in this browser and come back on your next visit.';
  $('forget').disabled = !files.length;
}
{
  const panel = $('saves'), btn = $('savesbtn');
  btn.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    btn.setAttribute('aria-expanded', String(!panel.hidden));
    btn.blur();
  });
  $('forget').addEventListener('click', () => { $('forgetask').hidden = false; $('forget').hidden = true; });
  $('forgetno').addEventListener('click', () => { $('forgetask').hidden = true; $('forget').hidden = false; });
  $('forgetyes').addEventListener('click', async () => {
    if (saves) saves.stop();
    await changes.forget(opts.bundle);
    location.reload();
  });
  showSaves(null);
}
// the sound: the game's AdLib, or the Amiga version's (made when first chosen)
let amiga = null, amigaLoading = null;
function setSound(v) {
  opts.sound = v;
  if (v === 'adlib') { if (amiga) amiga.setEnabled(false); return; }
  if (amiga) { amiga.setEnabled(true); amiga.setFilter(v === 'amiga-clean' ? 'off' : 'a500'); return; }
  if (amigaLoading) return;
  amigaLoading = makeAmigaSound({ data: 'dist/amiga-sound.bin', filter: v === 'amiga-clean' ? 'off' : 'a500' })

  const med = (a) => { if (!a.length) return '-'; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1].toFixed(2); };
  const st = cur && cur.st;
  $('status').textContent = (st ? `${st.session.type} · ${CIRCUITS[st.session.circuit] ?? ''} · ${st.view.mode} · frame ${st.frame}` : (mem ? 'waiting for a session' : 'starting')) + (padName ? ' · controller' : '');
  const gameFps = st ? st.session.fps : null, cycles = governor ? governor.cycles : null;
  // the page's own work per frame (the emulator shares the thread): median, the slowest tenth, the slowest
  const jsAt = (p) => (js.length ? +js[Math.min(js.length - 1, Math.floor(p * js.length))].toFixed(2) : null);
  const slowest = r.length ? Math.max(...r).toFixed(1) : '-';
  $('perf').textContent = `page ${r.length} fps · frame ${med(r)} ms, slowest ${slowest} · page work ${jsAt(0.5) ?? '-'} ms, slowest ${jsAt(1) ?? '-'} · draw ${med(d)} ms · game ${gameFps ?? '-'} fps, frames kept ${perf.kept}/s${cycles ? ` · ${cycles} cycles` : ''} · ${glCanvas.width}x${glCanvas.height} · style ${opts.style} · framing ${opts.framing}${opts.smooth ? ', smooth' : ''}, haze ${opts.haze}, texture ${opts.texture}, shadows ${opts.shadows}, lod ${opts.lod}, mirrors ${opts.mirrors}`;
  window.renderApp.perf = { pageFps: r.length, frameMs: +med(r) || null, drawMs: +med(d) || null, jsMs: jsAt(0.5), jsP90: jsAt(0.9), jsMax: jsAt(1), kept: perf.kept, gameFps, cycles, size: [glCanvas.width, glCanvas.height] };
  if (gpu) {
    // r3d=gpu: the scale (auto: the box's height in screen pixels, in game rows), what it showed
    if (opts.scale === 'auto') {
      const box = ($('stage') ?? ($('gpu').hidden ? $('screen') : $('gpu'))).getBoundingClientRect();
      gpuSeen.scale = Math.max(1, Math.min(6, Math.round(box.height * (window.devicePixelRatio || 1) / 200)));
    } else gpuSeen.scale = opts.scale;
    const ms = gpuSeen.ms.splice(0);
    // the 3D view's frame rate: the game's frames the page showed in the last second (no more
    // than the game makes, nor than the page draws)
    const fps = gpuSeen.shown - (gpuSeen.lastShown ?? gpuSeen.shown);
    gpuSeen.lastShown = gpuSeen.shown;
    window.renderApp.gpu = { scale: gpuSeen.scale, shown: gpuSeen.shown, fps, sendMs: +med(ms) || null, checked: gpuSeen.checked, differ: gpuSeen.differ, lastDiffer: gpuSeen.lastDiffer, errors: gpu.errors };
    if (opts.r3d === 'gpu') $('perf').textContent += ` · 3D ${fps} fps in WebGPU at ${gpuSeen.scale}x, ${$('gpu').width}x${$('gpu').height}, art ${opts.art}, ${med(ms)} ms a frame to send`;
  }
  perf.kept = 0;
}, 1000);

window.renderApp = { opts, renderer, state: null, track: null, perf: null, mem: null, reader: null, setStyle: (v) => { applyStyle(v); $('style').value = v; },
  // the time (ms) the page's frame loop has taken (bench.html)
  pageWorkMs: () => perf.work };
// the Phase 1 tools (route driver, autopilot) look for window.mapApp
window.mapApp = window.renderApp;
requestAnimationFrame(frameLoop);

(async () => {
  emulators.pathPrefix = new URL('node_modules/js-dos/dist/emulators/', location.href).href;
  const res = await fetch(opts.bundle, { cache: 'no-store' });
  if (!res.ok) throw new Error(`bundle ${opts.bundle}: HTTP ${res.status} (build one with build-bundle.mjs)`);
  const bundle = new Uint8Array(await res.arrayBuffer());
  for (const [n, b] of Object.entries(unzipSync(bundle, { filter: (f) => /^F1CT\d\d\.DAT$/i.test(f.name) }))) trackFiles[n.toUpperCase()] = b;
  const ownAudio = opts.audio === 'own' ? await makeOwnAudio().catch((e) => { log('audio-failed', { error: String(e) }); return null; }) : null;
  window.renderApp.audio = ownAudio;
  // the game's files kept from the last visit, laid over the bundle's
  const kept = opts.saves ? await changes.load(opts.bundle) : null;
  if (kept) log('saves-loaded', { files: kept.files });
  if (opts.machine === 'rust') {
    // our PC: the bundle's files, the kept ones over them; it runs on its own clock, as DOSBox does
    const files = unzipSync(bundle);
    if (kept) Object.assign(files, unzipSync(kept.zip));
    const pc = await createPC({ wasm: new URL('dist/machine.wasm', location.href), files, tail: ' /g' });
    rustPC = pc;
    ci = pcCommandInterface(pc, { zipSync, kept: kept?.files });
    if (opts.r3d === 'gpu') {
      // the 3D view drawn finer: WebGPU, or our port at the game's resolution without it
      try {
        gpu = await gpuView($('gpu'));
        if (opts.scale !== 'auto') gpuSeen.scale = opts.scale;
        log('gpu', { scale: opts.scale });
        gpu.device.lost.then((info) => {
          gpu = null; opts.r3d = 'ours';
          log('gpu-lost', { reason: info.reason, message: info.message });
          $('notice').textContent = 'WebGPU stopped: the 3D view is drawn at the game\'s resolution.';
        });
      } catch (e) {
        opts.r3d = 'ours';
        log('gpu-unavailable', { error: String(e) });
        $('notice').textContent = 'No WebGPU in this browser: the 3D view is drawn at the game\'s resolution.';
      }
    }
    if (opts.sound === 'adlib') { opts.sound = 'amiga'; log('adlib-unavailable'); }
    log('machine', { machine: 'rust' });
  } else {
    ci = await emulators.dosboxDirect(kept ? [bundle.slice(), kept.zip.slice()] : bundle.slice(), { audioWorklet: false });
  }
  if (opts.sleep === 'timer' && opts.machine !== 'rust') log('sleep', { timer: timerSleep(ci) });
  if (opts.saves) {
    // checked while the game is in its menus, not while it races
    saves = keeper(ci, { key: opts.bundle, store: changes, unzip: unzipSync, start: kept,
      busy: () => performance.now() - lastGameFrameAt < 1000,
      onStore: (r) => { log('saves-stored', { files: r.files }); showSaves(r); } });
    window.renderApp.saves = saves;
  }
  showSaves(kept);
  // the game's own sound, unless the Amiga's plays instead
  if (ownAudio) ci.events().onSoundPush((samples) => { if (opts.sound === 'adlib') ownAudio.push(samples, ci.soundFrequency()); });
  if (opts.audio === 'own' && opts.sound !== 'adlib') setSound(opts.sound);
  if (opts.manual === 'auto') {
    // the game's manual question: type the word for the player
    const helper = manualHelper({
      image: () => image, sendKey: (code, down) => ci.sendKeyEvent(code, down),
      onLanguage: (key) => log('manual-language', { key }),
      onJoystick: (key) => log('manual-joystick', { key }),
      onAnswer: (q) => {
        log('manual-answered', q);
        $('notice').textContent = `Typed the manual word for you: "${q.answer}" (page ${q.page}, paragraph ${q.paragraph}, line ${q.line}, word ${q.word}).`;
        setTimeout(() => { $('notice').textContent = ''; }, 8000);
      },
    });
    setInterval(helper.check, 250);
  }
  window.ci = ci; window.emuCi = ci; window.emuReady = true;
  log('ci-ready');
  if (opts.cycles === 'auto') {
    governor = cyclesGovernor({ send: (c) => { ci.sendBackendEvent({ type: 'wc-trigger-event', event: `cycles:${c}` }); log('cycles', { cycles: c }); } });
  }
  const ev = ci.events();
  ev.onFrame((rgb, rgba) => { pending = rgb ?? rgba; });
  const tryAttach = setInterval(() => {
    try {
      const m = attach(ci, { requireGame: true });
      if (!m.checked) return;
      mem = m; reader = createReader(m);
      window.renderApp.mem = mem; window.renderApp.reader = reader;
      clearInterval(tryAttach);
      log('attached', { imageSeg: m.imageSeg });
    } catch { /* gp.exe not loaded yet */ }
  }, 500);

  const held = new Set();
  const key = (e, down) => {
    if (e.metaKey) return;
    const code = CODE_TO_KEY[e.code];
    if (code === undefined) return;
    e.preventDefault();
    if (down && e.repeat) return;
    if (down && DRIVING_KEYS.has(e.code)) keysUsedAt = performance.now();
    if (down) held.add(code); else held.delete(code);
    ci.sendKeyEvent(code, down);
  };
  window.addEventListener('keydown', (e) => key(e, true), true);
  window.addEventListener('keyup', (e) => key(e, false), true);
  window.addEventListener('blur', () => { for (const c of held) ci.sendKeyEvent(c, false); held.clear(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) ci.pause(); else ci.resume(); });
})().catch((e) => { $('status').textContent = `error: ${e.message || e}`; log('page-error', { error: String(e?.stack ?? e) }); console.error(e); });
</script>
</body>
</html>
