<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1GP Track Renderer</title>
<!--
  The game runs in js-dos direct mode; the page reads its state every
  animation frame and draws the 3D view with WebGL from the game's camera, at
  the canvas's full resolution. By default it shows one screen: the game's
  own screen in the menus, and in the car our view with the game's cockpit,
  dash, mirrors and messages laid over it.

    cd spike && node serve.mjs --port 8080
    http://127.0.0.1:8080/render.html?bundle=dist/p2-render-25000.jsdos

  Query options:
    bundle=...            the js-dos bundle (built with build-bundle.mjs; default
                          dist/f1gp.jsdos, the one build-site.mjs puts on the site)
    framing=wide|original wide keeps the game's vertical scale and shows more
                          at the sides; original matches the game's framing
    smooth=1|0            ease between game frames (one game frame behind)
    layout=single|side|gl|overlay  single (default): one screen, the game's screen
                          in menus and our 3D view when you are in the car, with
                          the game's cockpit, dash and messages laid over it;
                          side: the original screen beside the new view; gl: the
                          new view alone; overlay: the new view (game framing)
                          laid half transparent over the original screen
    screen=new|original   new (default in the single layout): the game's own 3D
                          drawing is replaced by a fill (lib/overlay.mjs; the game
                          still draws its mirror backdrop and start lights, the page
                          the cars in the mirrors) and our view shows instead;
                          original (default in the others): the game draws its 3D
                          as it always did. Also a menu.
    cars=1|0              draw the cars as the game does (boxes with source=file)
    objects=1|0           draw the trackside objects (stands, buildings, trees, boards)
    style=modern|classic  modern: every car as a 3D model at any distance, 3D wheels
                          and helmets, all cars on the circuit, smooth haze;
                          classic: as the game draws (bitmap cars beyond 52 ft,
                          bitmap wheels and helmets, its choice of cars, its haze
                          steps) and the game's 4:3 framing. Also a menu on the page.
    manual=auto|off       auto: take the player through the manual check (English manual,
                          the word typed) and the joystick question (Use Keys)
    audio=own|off         the game's sound through our AudioWorklet (starts on the first
                          key or click), or none
    sound=adlib|amiga|amiga-clean  the PC version's AdLib sound (the game's own), or the
                          Amiga version's: its title tune in the menus, its sampled engine
                          and race effects in a session, played from the game's events
                          (lib/amiga-sound.mjs; needs dist/amiga-sound.bin), through the
                          A500's filters or without them (clean). Also a menu.
    haze=smooth|classic|off  distance haze with the game's haze tables: blended,
                          in the game's steps, or none (default from the style)
    texture=smooth|classic|off  the ground texture (the game's T option): the road and
                          grass in their neighbouring shades, blended or in the game's
                          whole shades, or flat (default from the style)
    crowd=stands|sharp|screen  the crowd in the stands: on the stands, in coarser texels far
                          away (modern), on the stands texel by texel (classic), or fixed
                          to the screen as the game draws it
    fps=30|25|15|...|game the game's frame rate, set in the menus for the next session
                          (30, the default, is the most the game's physics allows; game
                          keeps the game's own setting, 15 in the Quick Race)
    cycles=auto|fixed     auto: the emulated CPU runs slower (8,000 cycles, raised when
                          the game's load climbs) while our view replaces the game's
                          drawing, and at 25,000 otherwise; fixed: as the bundle says
    source=memory|file    build the scene from the game's memory (all parts,
                          the game's colours, sky and horizon image) or from
                          the track file (road, kerbs and verges only)
-->
<style>
  :root { --bg: #f4f3ef; --fg: #1d1d1b; --muted: #6b6a66; --panel: #ffffff; --line: #d9d7d0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecebe6; --muted: #9a9993; --panel: #20201e; --line: #3a3936; }
  }
  :root[data-theme="dark"] { --bg: #161615; --fg: #ecebe6; --muted: #9a9993; --panel: #20201e; --line: #3a3936; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  #status { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  #notice { color: var(--muted); font-size: 13px; }
  header label { color: var(--muted); font-size: 13px; }
  header select { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
  main { display: flex; gap: 12px; padding: 0 16px 16px; flex-wrap: wrap; align-items: flex-start; }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  #screen { width: 480px; aspect-ratio: 4 / 3; image-rendering: pixelated; display: block; outline: none; }
  #gl { width: min(100%, 960px); aspect-ratio: 16 / 9; display: block; }
  .glpane { flex: 1 1 560px; min-width: 0; }
  .glwrap { position: relative; }
  #glnote { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; color: #c9c8c2; font-size: 15px; pointer-events: none; }
  #glnote[hidden] { display: none; }
  #perf { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin: 6px 0 0; }
  body.gl-only .origpane { display: none; }
  body.overlay .glpane { display: none; }
  body.overlay .origpane { position: relative; }
  body.overlay #screen { width: min(960px, calc(100vw - 50px)); }
  #overgl { display: none; position: absolute; left: 8px; top: 8px; opacity: 0.5; pointer-events: none; image-rendering: pixelated; }
  body.overlay #overgl { display: block; }
  @media (max-width: 700px) { #screen { width: 100%; } main { padding: 0 16px 16px; } }
  /* one screen */
  body.single main { display: block; padding: 0 16px 12px; }
  #stage { position: relative; width: 100%; height: calc(100vh - 72px); min-height: 240px; background: #000; overflow: hidden; border-radius: 6px; }
  #stage canvas { position: absolute; top: 0; height: 100%; display: block; image-rendering: pixelated; }
  #stage #screen, #stage #hud { left: 50%; transform: translateX(-50%); width: auto; aspect-ratio: 4 / 3; }
  #stage #gl { left: 0; width: 100%; aspect-ratio: auto; image-rendering: auto; }
  body.classic #stage #gl { left: 50%; transform: translateX(-50%); width: auto; aspect-ratio: 4 / 3; }
  #stage #hud { pointer-events: none; }
  #stage [hidden] { display: none; }
  body.single #perf { margin: 6px 0 0; }
</style>
</head>
<body>
<header><h1>F1GP track renderer</h1>
  <label>Screen <select id="screenmode"><option value="new">New view</option><option value="original">Original game</option></select></label>
  <label>Sound <select id="sound"><option value="adlib">PC: AdLib</option><option value="amiga">Amiga</option><option value="amiga-clean">Amiga, no filter</option></select></label>
  <label>Style <select id="style"><option value="modern">Modern: 3D cars</option><option value="classic">Classic: as the original</option></select></label>
  <span id="status">loading...</span><span id="notice"></span></header>
<main>
  <div class="pane origpane"><canvas id="screen" width="320" height="200" tabindex="0"></canvas><canvas id="overgl"></canvas></div>
  <div class="pane glpane"><div class="glwrap"><canvas id="gl"></canvas><div id="glnote">The new view starts when you are in the car.</div></div><pre id="perf"></pre></div>
</main>
<script src="node_modules/js-dos/dist/emulators/emulators.js"></script>
<script type="module">
import { attach } from './lib/f1gp-mem.mjs';
import { createReader } from './lib/f1gp-state.mjs';
import { parseTrack, compileTrack, compilePitLane, CIRCUITS } from './lib/track-file.mjs';
import { fromCompiled } from './lib/track-mesh.mjs';
import { TrackRenderer, cameraFromState, lerpCamera } from './lib/gl-track.mjs';
import { readScene, readPalette, horizonOff, markingsKey } from './lib/scene.mjs';
import { readObjects, readCrowd, cameraInPitLane } from './lib/objects.mjs';
import { readCars, carStates, selectCars, frameCars, lerpCarStates } from './lib/cars.mjs';
import { makeOwnAudio } from './lib/audio.mjs';
import { makeAmigaSound } from './lib/amiga-sound.mjs';
import { manualHelper } from './lib/manual.mjs';
import { sceneRoutine, viewportFill, chooseMarker, keyFrame, paintMirrors, shownMarker } from './lib/overlay.mjs';
import { setFrameRate, frameTicks, readFrameTicks, readWorkTicks, cyclesGovernor, framePacer } from './lib/pace.mjs';
import { unzipSync } from './node_modules/fflate/esm/browser.js';

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const opts = {
  bundle: q.get('bundle') ?? 'dist/f1gp.jsdos',
  framing: q.get('framing') ?? 'wide',
  smooth: (q.get('smooth') ?? '1') !== '0',
  layout: q.get('layout') ?? 'single',
  // the single layout swaps to our view; the comparison layouts keep the game's drawing unless asked
  screen: q.get('screen') ?? ((q.get('layout') ?? 'single') === 'single' ? 'new' : 'original'),
  cars: (q.get('cars') ?? '1') !== '0',
  source: q.get('source') ?? 'memory',
  objects: (q.get('objects') ?? '1') !== '0',
  style: q.get('style') === 'classic' ? 'classic' : 'modern',
  hazeParam: q.get('haze'),
  textureParam: q.get('texture'),
  crowdParam: q.get('crowd'),
  audio: q.get('audio') ?? 'own',
  sound: ['amiga', 'amiga-clean'].includes(q.get('sound')) ? q.get('sound') : 'adlib',
  manual: q.get('manual') ?? 'auto',
  framingParam: q.get('framing'),
  // the game's frame rate, set in the menus for the next session (30 at most); 'game' keeps the game's own
  fps: q.get('fps') === 'game' ? null : Math.min(30, Math.max(8, +(q.get('fps') ?? 30) || 30)),
  // auto: a low emulated CPU speed while our view replaces the game's drawing, raised when the game needs it
  cycles: q.get('cycles') ?? 'auto',
};
// the style sets the defaults; explicit haze= and framing= win
function applyStyle(style) {
  opts.style = style;
  opts.haze = opts.hazeParam ?? (style === 'classic' ? 'classic' : 'smooth');
  opts.texture = opts.textureParam ?? (style === 'classic' ? 'classic' : 'smooth');
  opts.crowd = opts.crowdParam ?? (style === 'classic' ? 'sharp' : 'stands');
  if (!opts.framingParam && opts.layout !== 'overlay') opts.framing = style === 'classic' ? 'original' : 'wide';
  document.body.classList.toggle('classic', style === 'classic');
}
applyStyle(opts.style);
{
  const sel = $('style');
  sel.value = opts.style;
  sel.addEventListener('change', () => {
    applyStyle(sel.value);
    const u = new URL(location.href);
    u.searchParams.set('style', sel.value);
    history.replaceState(null, '', u);
    sel.blur(); // keys go back to the game
  });
}
if (opts.layout === 'gl') document.body.classList.add('gl-only');
if (opts.layout === 'single') {
  // one stage: the game's screen, our view and the game's screen as an overlay, in one box
  document.body.classList.add('single');
  const stage = document.createElement('div');
  stage.id = 'stage';
  const hudCanvas = document.createElement('canvas');
  hudCanvas.id = 'hud'; hudCanvas.width = 320; hudCanvas.height = 200; hudCanvas.hidden = true;
  const gl = $('gl'), scr = $('screen'), perfEl = $('perf');
  document.querySelector('main').prepend(stage);
  stage.append(gl, hudCanvas, scr);
  gl.hidden = true;
  stage.after(perfEl);
  document.querySelector('.origpane').remove();
  document.querySelector('.glpane').remove();
}
{
  const sel = $('screenmode');
  sel.value = opts.screen;
  sel.addEventListener('change', () => {
    opts.screen = sel.value;
    const u = new URL(location.href);
    u.searchParams.set('screen', sel.value);
    history.replaceState(null, '', u);
    sel.blur();
  });
}
// the sound: the game's AdLib, or the Amiga version's (made when first chosen)
let amiga = null, amigaLoading = null;
function setSound(v) {
  opts.sound = v;
  if (v === 'adlib') { if (amiga) amiga.setEnabled(false); return; }
  if (amiga) { amiga.setEnabled(true); amiga.setFilter(v === 'amiga-clean' ? 'off' : 'a500'); return; }
  if (amigaLoading) return;
  amigaLoading = makeAmigaSound({ data: 'dist/amiga-sound.bin', filter: v === 'amiga-clean' ? 'off' : 'a500' })
    .then((a) => { amiga = a; window.renderApp.amiga = a; log('amiga-sound', { filter: v }); if (opts.sound === 'adlib') a.setEnabled(false); else a.setFilter(opts.sound === 'amiga-clean' ? 'off' : 'a500'); })
    .catch((e) => {
      log('amiga-sound-failed', { error: String(e) });
      $('notice').textContent = `No Amiga sound: ${e.message}`;
      opts.sound = 'adlib'; $('sound').value = 'adlib';
    })
    .finally(() => { amigaLoading = null; });
}
{
  const sel = $('sound');
  sel.value = opts.sound;
  if (opts.audio === 'off') sel.disabled = true;
  sel.addEventListener('change', () => {
    setSound(sel.value);
    const u = new URL(location.href);
    u.searchParams.set('sound', sel.value);
    history.replaceState(null, '', u);
    sel.blur();
  });
}
if (opts.layout === 'overlay') { document.body.classList.add('overlay'); opts.framing = 'screen'; }
const events = window.emuEvents = [];
const log = (type, extra = {}) => events.push({ t: Math.round(performance.now()), type, ...extra });

// KeyboardEvent.code -> js-dos key code (GLFW numbering), as in raw.html
const CODE_TO_KEY = (() => {
  const m = {
    Space: 32, Quote: 39, Comma: 44, Minus: 45, Period: 46, Slash: 47, Semicolon: 59, Equal: 61,
    BracketLeft: 91, Backslash: 92, BracketRight: 93, Backquote: 96,
    Escape: 256, Enter: 257, Tab: 258, Backspace: 259, Insert: 260, Delete: 261,
    ArrowRight: 262, ArrowLeft: 263, ArrowDown: 264, ArrowUp: 265, PageUp: 266, PageDown: 267, Home: 268, End: 269,
    ShiftLeft: 340, ControlLeft: 341, AltLeft: 342, ShiftRight: 344, ControlRight: 345, AltRight: 346,
  };
  for (let i = 0; i < 26; i++) m['Key' + String.fromCharCode(65 + i)] = 65 + i;
  for (let i = 0; i < 10; i++) m['Digit' + i] = 48 + i;
  for (let i = 1; i <= 12; i++) m['F' + i] = 289 + i;
  return m;
})();

// ------------------------------------------------------------ original screen
const screen = $('screen'), g = screen.getContext('2d');
let image = g.createImageData(320, 200), pending = null;
let hud = null; // { ctx, image } of the overlay canvas (single layout)
function blitScreen(hudView) {
  if (!pending) return;
  const src = pending; pending = null;
  const w = ci.width(), h = ci.height();
  if (w !== screen.width || h !== screen.height) { screen.width = w; screen.height = h; image = g.createImageData(w, h); }
  const dst = image.data;
  if (src.length === dst.length) dst.set(src);
  else for (let i = 0, j = 0; j < dst.length;) { dst[j++] = src[i++]; dst[j++] = src[i++]; dst[j++] = src[i++]; dst[j++] = 255; }
  g.putImageData(image, 0, 0);
  // the game's cockpit, dash and messages over our view: its screen with the marker see-through
  if (hudView && w === 320 && h === 200) {
    if (!hud) { const c = $('hud').getContext('2d'); hud = { ctx: c, image: c.createImageData(320, 200) }; }
    // the marker as shown (the game fades the screen in and out), and our view faded to match
    const shown = shownMarker(src, hudView.marker, hudView);
    keyFrame(src, hud.image.data, shown.rgb, hudView);
    const filter = shown.brightness < 0.99 ? `brightness(${shown.brightness.toFixed(3)})` : '';
    if (glCanvas.style.filter !== filter) glCanvas.style.filter = filter;
    // the cars in the cockpit mirrors: the game draws them in the step the fill replaces
    if (hudView.cockpit && carData && mirrorCars.length) {
      const pal = shown.brightness < 0.99 ? hudView.palette.map((v) => Math.round(v * shown.brightness)) : hudView.palette;
      paintMirrors(hud.image.data, mirrorCars, carData, pal);
    }
    hud.ctx.putImageData(hud.image, 0, 0);
  }
}

// ------------------------------------------------------------ new view
const glCanvas = opts.layout === 'overlay' ? $('overgl') : $('gl');
const renderer = new TrackRenderer(glCanvas);
function sizeCanvas() {
  if (opts.layout === 'overlay') {
    // match the original screen's box exactly
    const s = screen.getBoundingClientRect();
    glCanvas.style.width = `${s.width}px`; glCanvas.style.height = `${s.height}px`;
  }
  const r = glCanvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (glCanvas.width !== w || glCanvas.height !== h) { glCanvas.width = w; glCanvas.height = h; }
}

const trackFiles = {};
let ci = null, mem = null, reader = null, circuit = -1;
let cur = null;               // the newest game frame: { st, cam, cars, t, step }
const pacer = framePacer({ smooth: opts.smooth }); // the frames the page draws between
let governor = null;          // the emulated CPU speed (cycles=auto)
let carData = null;           // readCars(mem) for the circuit (source=memory)
let routine = null;           // the fill that replaces the game's 3D drawing (lib/overlay.mjs)
let sceneOpts = null, markKey = null; // the scene's options, and its markings when built (scene.mjs markingsKey)
let swapped = false;          // single layout: our view is showing
let mirrorCars = [];          // frameCars().mirrors of the last drawn frame (cockpit)
const routineSeen = { calls: -1, at: -1e9 }; // when the routine's call counter last moved
const perf = { raf: [], draw: [], frames: 0, kept: 0, last: null };

const teamColour = (car) => (car.isPlayer ? [255, 120, 20] : [235, 235, 235]);

function loadCircuit(st) {
  const c = st.session.circuit, name = `F1CT${String(c + 1).padStart(2, '0')}.DAT`;
  const bytes = trackFiles[name];
  if (!bytes) { log('no-track-file', { name }); return; }
  const parsed = parseTrack(bytes);
  let info;
  if (opts.source === 'memory') {
    // everything the game built at track load, read from its memory
    const scene = readScene(mem);
    sceneOpts = { surroundRoad: (parsed.header.surrounding & 0x80) !== 0 };
    info = renderer.setScene(scene, sceneOpts);
    markKey = markingsKey(mem);
    carData = null;
    if (opts.cars) {
      try { carData = readCars(mem); }
      catch (e) { log('cars-failed', { error: String(e?.stack ?? e) }); }
    }
    if (opts.objects) {
      try { info.objects = renderer.setObjects(readObjects(mem), readCrowd(mem), { cars: carData }); }
      catch (e) { log('objects-failed', { error: String(e?.stack ?? e) }); }
    } else if (carData) renderer.setCarSprites(carData);
  } else {
    const compiled = compileTrack(parsed).segs;
    const segs = fromCompiled(compiled);
    const pitSegs = fromCompiled(compilePitLane(parsed, compiled).segs);
    info = renderer.setTrack(segs, { track: parsed, pitSegs, surround: parsed.header.surrounding ? 'grey' : 'green' });
  }
  circuit = c;
  if (routine) routine.setK(chooseMarker(readPalette(mem)));
  log("track", { circuit: c, name: CIRCUITS[c], source: opts.source, vertices: info.count, parts: info.parts });
  window.renderApp.track = { circuit: c, name: CIRCUITS[c], source: opts.source, vertices: info.count, parts: info.parts, objects: info.objects };
}

let loopErrors = 0, lastPaletteAt = 0;
function frameLoop(now) {
  try { frame(now); } catch (e) {
    if (loopErrors++ < 5) { log('frame-error', { error: String(e?.stack ?? e) }); console.error(e); }
  }
  requestAnimationFrame(frameLoop);
}

function frame(now) {
  if (perf.last !== null) perf.raf.push(now - perf.last);
  perf.last = now;
  // the game's own 3D drawing: replaced by the fill for the new view, put back for the original
  if (mem && !routine) routine = sceneRoutine(mem, chooseMarker(readPalette(mem)));
  if (routine) {
    if (opts.screen === 'new' && !routine.installed) { if (routine.install()) log('game-3d-off', { marker: routine.k }); }
    else if (opts.screen === 'original' && routine.installed) { routine.uninstall(); log('game-3d-on'); }
  }
  // the game draws a race view while the routine runs (it stops in pause, where the frame stays)
  if (routine && routine.installed) { const c = routine.calls; if (c !== routineSeen.calls) { routineSeen.calls = c; routineSeen.at = now; } }
  const drawing = !!routine && routine.installed && (now - routineSeen.at < 500 || (!!cur && cur.st.paused));
  const swap = opts.layout === 'single' && opts.screen === 'new' && !!cur && drawing;
  let hudView = null;
  if (swap) {
    const v = viewportFill(cur.st.view.mode), pal = readPalette(mem), k = routine.k;
    hudView = { top: v.top, rows: v.rows, cockpit: cur.st.view.mode === 'cockpit', marker: [pal[k * 3], pal[k * 3 + 1], pal[k * 3 + 2]], palette: pal };
  }
  if (ci) blitScreen(hudView);
  if (opts.layout === 'single' && swap !== swapped) {
    swapped = swap;
    $('gl').hidden = !swap; $('hud').hidden = !swap; $('screen').hidden = swap;
    log(swap ? 'swap-new-view' : 'swap-game-screen');
  }
  sizeCanvas();
  if (amiga && opts.sound !== 'adlib') amiga.update(mem);
  if (mem) {
    const st = reader.read();
    window.renderApp.state = st;
    if (st.inSession && st.track.lapSegments > 0) {
      if (st.session.circuit !== circuit) loadCircuit(st);
      if (st.consistent && (!cur || st.frame !== cur.st.frame)) {
        if (routine && routine.installed) routine.setView(viewportFill(st.view.mode));
        cur = { st, cam: cameraFromState(st), cars: null, t: st.frame * st.frameMs, step: st.frameMs };
        // the cars' poses and the game's choice of cars, read at the same moment as st
        if (carData) {
          const states = carStates(carData, st);
          cur.cars = { states, drawn: selectCars(carData, states).drawn };
        }
        pacer.add(cur);
        perf.kept++;
        // the emulated CPU speed: low while the fill draws nothing, raised when the game's load climbs
        if (governor) governor.update({ racing: drawing, work: readWorkTicks(mem), ticks: readFrameTicks(mem), now });
      }
    } else {
      cur = null;
      pacer.clear();
      // the frame rate takes effect when the next session loads
      if (opts.fps && setFrameRate(mem, opts.fps)) log('frame-rate', { fps: 300 / frameTicks(opts.fps) });
      if (governor) governor.update({ racing: false, now });
    }
  }
  const t0 = performance.now();
  const note = $('glnote');
  if (note && note.hidden !== !!cur) note.hidden = !!cur;
  if (cur) {
    // between the two game frames around the render clock (one frame behind the newest);
    // not across a change of view or a camera cut
    const { a: prev, b: shown, alpha } = pacer.pick(now, cur.st.paused,
      (a, b) => a.cam.rows !== b.cam.rows || Math.hypot(a.cam.x - b.cam.x, a.cam.y - b.cam.y) > 64 * 200);
    const cam = alpha < 1 ? lerpCamera(prev.cam, shown.cam, alpha) : { ...shown.cam };
    const st = shown.st;
    if (opts.cars && carData && shown.cars) {
      const smoothCars = alpha < 1 && prev.cars;
      const states = smoothCars ? lerpCarStates(prev.cars.states, shown.cars.states, alpha) : shown.cars.states;
      const modern = opts.style === 'modern';
      // classic: the game's choice of cars; modern: every car on the circuit, 3D at any distance
      const fc = frameCars(carData, st, { x: cam.x, y: cam.y, z: cam.z, heading: cam.heading, mode: st.view.mode },
        { origin: [renderer.origin[0], renderer.origin[1]], indexed: true, states, drawn: modern ? undefined : shown.cars.drawn, all: modern,
          modern, paletteRgb: renderer.lastPalette, wide: modern || opts.framing === 'wide' });
      renderer.setCarFrame(fc, carData);
      mirrorCars = fc.mirrors;
    } else if (opts.cars) {
      const cars = [];
      for (let i = 0; i < st.cars.length; i++) {
        const c = st.cars[i];
        if (c.pos === 'none' || !c.visible) continue;
        let x = c.x / 256, y = c.y / 256, z = c.z, heading = c.heading;
        const p = alpha < 1 ? prev.st.cars[i] : null;
        if (p && p.pos !== 'none') {
          x = p.x / 256 + (x - p.x / 256) * alpha; y = p.y / 256 + (y - p.y / 256) * alpha; z = p.z + (z - p.z) * alpha;
          heading = (p.heading + ((((heading - p.heading + 0x18000) % 0x10000) - 0x8000) * alpha) + 0x10000) % 0x10000;
        }
        // in the cockpit, skip the viewed car itself
        if (st.view.mode === 'cockpit' && i === st.view.viewedSlot) continue;
        cars.push({ x, y, z, heading, colour: teamColour(c) });
      }
      renderer.setCars(cars);
    }
    cam.noHorizonImage = horizonOff(mem);
    // the original framing: the canvas takes the shape of the game's 3D view (320 columns by
    // cam.rows rows of a 4:3 screen), so nothing is stretched
    const shape = opts.framing === 'original' && opts.layout !== 'overlay' && opts.layout !== 'single' ? `320 / ${(cam.rows * 1.2).toFixed(1)}` : '';
    if (glCanvas.style.aspectRatio !== shape) glCanvas.style.aspectRatio = shape;
    if (opts.source === 'memory' && now - lastPaletteAt > 500) {
      lastPaletteAt = now;
      renderer.setPalette(readPalette(mem));
      // the game rewrites its road markings at the start of a session and when the best-line aid
      // is turned on or off: build the track again
      const k = markingsKey(mem);
      if (sceneOpts && k !== markKey) { markKey = k; renderer.setScene(readScene(mem), sceneOpts); log('markings-changed'); }
    }
    if (opts.layout !== 'single' || swapped) {
      renderer.draw(cam, { framing: opts.layout === 'single' ? 'stage' : opts.framing, haze: opts.haze, texture: opts.texture, crowd: opts.crowd, pitLane: renderer.objects ? cameraInPitLane(mem) : false });
    }
    perf.frames++;
  }
  perf.draw.push(performance.now() - t0);
}

setInterval(() => {
  const r = perf.raf.splice(0), d = perf.draw.splice(0);
  const med = (a) => { if (!a.length) return '-'; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1].toFixed(2); };
  const st = cur && cur.st;
  $('status').textContent = st ? `${st.session.type} · ${CIRCUITS[st.session.circuit] ?? ''} · ${st.view.mode} · frame ${st.frame}` : (mem ? 'waiting for a session' : 'starting');
  const gameFps = st ? st.session.fps : null, cycles = governor ? governor.cycles : null;
  $('perf').textContent = `page ${r.length} fps · frame ${med(r)} ms · draw ${med(d)} ms · game ${gameFps ?? '-'} fps, frames kept ${perf.kept}/s${cycles ? ` · ${cycles} cycles` : ''} · ${glCanvas.width}x${glCanvas.height} · style ${opts.style} · framing ${opts.framing}${opts.smooth ? ', smooth' : ''}, haze ${opts.haze}, texture ${opts.texture}`;
  window.renderApp.perf = { pageFps: r.length, frameMs: +med(r) || null, drawMs: +med(d) || null, kept: perf.kept, gameFps, cycles, size: [glCanvas.width, glCanvas.height] };
  perf.kept = 0;
}, 1000);

window.renderApp = { opts, renderer, state: null, track: null, perf: null, mem: null, reader: null, setStyle: (v) => { applyStyle(v); $('style').value = v; } };
// the Phase 1 tools (route driver, autopilot) look for window.mapApp
window.mapApp = window.renderApp;
requestAnimationFrame(frameLoop);

(async () => {
  emulators.pathPrefix = new URL('node_modules/js-dos/dist/emulators/', location.href).href;
  const res = await fetch(opts.bundle, { cache: 'no-store' });
  if (!res.ok) throw new Error(`bundle ${opts.bundle}: HTTP ${res.status} (build one with build-bundle.mjs)`);
  const bundle = new Uint8Array(await res.arrayBuffer());
  for (const [n, b] of Object.entries(unzipSync(bundle, { filter: (f) => /^F1CT\d\d\.DAT$/i.test(f.name) }))) trackFiles[n.toUpperCase()] = b;
  const ownAudio = opts.audio === 'own' ? await makeOwnAudio().catch((e) => { log('audio-failed', { error: String(e) }); return null; }) : null;
  window.renderApp.audio = ownAudio;
  ci = await emulators.dosboxDirect(bundle.slice(), { audioWorklet: false });
  // the game's own sound, unless the Amiga's plays instead
  if (ownAudio) ci.events().onSoundPush((samples) => { if (opts.sound === 'adlib') ownAudio.push(samples, ci.soundFrequency()); });
  if (opts.audio === 'own' && opts.sound !== 'adlib') setSound(opts.sound);
  if (opts.manual === 'auto') {
    // the game's manual question: type the word for the player
    const helper = manualHelper({
      image: () => image, sendKey: (code, down) => ci.sendKeyEvent(code, down),
      onLanguage: (key) => log('manual-language', { key }),
      onJoystick: (key) => log('manual-joystick', { key }),
      onAnswer: (q) => {
        log('manual-answered', q);
        $('notice').textContent = `Typed the manual word for you: "${q.answer}" (page ${q.page}, paragraph ${q.paragraph}, line ${q.line}, word ${q.word}).`;
        setTimeout(() => { $('notice').textContent = ''; }, 8000);
      },
    });
    setInterval(helper.check, 250);
  }
  window.ci = ci; window.emuCi = ci; window.emuReady = true;
  log('ci-ready');
  if (opts.cycles === 'auto') {
    governor = cyclesGovernor({ send: (c) => { ci.sendBackendEvent({ type: 'wc-trigger-event', event: `cycles:${c}` }); log('cycles', { cycles: c }); } });
  }
  const ev = ci.events();
  ev.onFrame((rgb, rgba) => { pending = rgb ?? rgba; });
  const tryAttach = setInterval(() => {
    try {
      const m = attach(ci, { requireGame: true });
      if (!m.checked) return;
      mem = m; reader = createReader(m);
      window.renderApp.mem = mem; window.renderApp.reader = reader;
      clearInterval(tryAttach);
      log('attached', { imageSeg: m.imageSeg });
    } catch { /* gp.exe not loaded yet */ }
  }, 500);

  const held = new Set();
  const key = (e, down) => {
    if (e.metaKey) return;
    const code = CODE_TO_KEY[e.code];
    if (code === undefined) return;
    e.preventDefault();
    if (down && e.repeat) return;
    if (down) held.add(code); else held.delete(code);
    ci.sendKeyEvent(code, down);
  };
  window.addEventListener('keydown', (e) => key(e, true), true);
  window.addEventListener('keyup', (e) => key(e, false), true);
  window.addEventListener('blur', () => { for (const c of held) ci.sendKeyEvent(c, false); held.clear(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) ci.pause(); else ci.resume(); });
})().catch((e) => { $('status').textContent = `error: ${e.message || e}`; log('page-error', { error: String(e?.stack ?? e) }); console.error(e); });
</script>
</body>
</html>
